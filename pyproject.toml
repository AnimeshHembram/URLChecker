[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck-cli"
dynamic = ["version"]
description = "A free, local-first command-line tool that checks lists of URLs and exports CSV reports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Animesh Hembram" }]
keywords = ["link checker", "url", "broken links", "cli", "csv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
]
dependencies = ["httpx>=0.28.1,<0.29"]

[project.urls]
Homepage = "https://github.com/AnimeshHembram/URLChecker"
Source = "https://github.com/AnimeshHembram/URLChecker"
Issues = "https://github.com/AnimeshHembram/URLChecker/issues"
Changelog = "https://github.com/AnimeshHembram/URLChecker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff==0.17.1"]

[project.scripts]
linkcheck = "linkcheck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "linkcheck.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["linkcheck"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
