[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck-cli"
version = "0.1.0"
description = "A free command-line URL checker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
linkcheck = "linkcheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]